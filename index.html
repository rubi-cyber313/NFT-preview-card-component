<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

  <link rel="icon" type="image/png" sizes="32x32" href="icon-view.svg">
  <link rel="stylesheet" href="stylesheet8.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>

<body>
  <main>
    <img src="image-equilibrium.jpg" alt="equilibrium NFT artwork" class="Equilibrium-img">
    <h1>Equilibrium #3429</h1>

    <p>Our Equilibrium collection promotes balance and calm.
    </p>
    <div class="icon">
      <span><img src="icon-ethereum.svg" alt="">0.041 ETH</span>
      <span><img src="icon-clock.svg" alt="">3 days left</span>
    </div>
    <hr>
    <div class="creator">
      <img src="image-avatar.png" alt="" class="avatar-img">
      <p>Creation of <span>Jules Wyvern</span></p>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Rubi</a>.
  </footer>
</body>
